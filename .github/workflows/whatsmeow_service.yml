name: Whatsmeow Service

on:
  pull_request:
    paths:
      - 'whatsmeow-service/**'
      - '.github/workflows/whatsmeow_service.yml'
  push:
    branches:
      - develop
      - codex/whatsmeow-stars-groups
    paths:
      - 'whatsmeow-service/**'
      - '.github/workflows/whatsmeow_service.yml'

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsmeow-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-file: whatsmeow-service/go.mod
          cache: false
      - name: Apply pinned dependency patches
        run: |
          go mod download
          module_dir="$(go list -m -f '{{.Dir}}' github.com/polymorfa/hypermeow)"
          chmod -R u+w "$module_dir"
          patch -d "$module_dir" -p1 < patches/hypermeow-status-receipt-participant.patch
          module_dir="$(go list -m -f '{{.Dir}}' github.com/purpshell/meowcaller)"
          chmod -R u+w "$module_dir"
          patch -d "$module_dir" -p1 < patches/meowcaller-linked-device-reject.patch
          patch -d "$module_dir" -p1 < patches/meowcaller-group-jid.patch
      - run: go test github.com/purpshell/meowcaller/... -count=1
      - run: go test ./...
      - run: go vet ./...
      - run: docker build -t whatsmeow-service:check .
      - name: Publish the validated service image
        if: github.event_name == 'push'
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          image=ghcr.io/${{ github.repository_owner }}/whatsmeow-service:fork-${{ github.sha }}
          docker tag whatsmeow-service:check "$image"
          docker push "$image"
