name: Telegram personal account QR

on:
  push:
    branches: [codex/telegram-personal-qr]
  pull_request:
    paths:
      - 'telegram-personal-service/**'
      - 'app/**/telegram_personal*'
      - '.github/workflows/telegram_personal.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram-personal-service/requirements.txt
      - run: pip install -r telegram-personal-service/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pytest -q
        working-directory: telegram-personal-service

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec vitest run
          app/javascript/dashboard/routes/dashboard/settings/inbox/components/specs/TelegramPersonalChannelList.spec.js
          app/javascript/dashboard/routes/dashboard/settings/inbox/components/specs/TelegramPersonalPairing.spec.js
          app/javascript/dashboard/routes/dashboard/settings/inbox/components/specs/TelegramPersonalConfiguration.spec.js
          app/javascript/dashboard/helper/specs/inbox.spec.js
          app/javascript/shared/mixins/specs/inboxMixin.spec.js
          app/javascript/dashboard/components/widgets/conversation/specs/ReplyBox.spec.js
          app/javascript/dashboard/components-next/icon/specs/provider.spec.js
          app/javascript/dashboard/store/modules/specs/conversations/helpers.spec.js
      - name: Lint Telegram interface
        run: >-
          pnpm exec eslint
          app/javascript/dashboard/components/widgets/conversation/ReplyBox.vue
          app/javascript/dashboard/components/widgets/conversation/specs/ReplyBox.spec.js
          app/javascript/dashboard/components/widgets/ChannelItem.vue
          app/javascript/dashboard/routes/dashboard/settings/inbox/ChannelList.vue
          app/javascript/dashboard/i18n/locale/en/index.js
          app/javascript/dashboard/i18n/locale/pt_BR/index.js
          app/javascript/dashboard/routes/dashboard/settings/inbox/components/specs/TelegramPersonalChannelList.spec.js
          app/javascript/dashboard/routes/dashboard/settings/inbox/components/TelegramPersonalPairing.vue
          app/javascript/dashboard/routes/dashboard/settings/inbox/channels/TelegramPersonal.vue
          app/javascript/dashboard/routes/dashboard/settings/inbox/settingsPage/TelegramPersonalConfiguration.vue
          app/javascript/dashboard/routes/dashboard/settings/inbox/components/specs/TelegramPersonalPairing.spec.js
          app/javascript/dashboard/routes/dashboard/settings/inbox/components/specs/TelegramPersonalConfiguration.spec.js
      - run: pnpm exec vite build

  rails:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USERNAME: postgres
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake db:create db:schema:load db:migrate
      - name: Validate account channel and preserve bot/Whatsmeow behavior
        run: >-
          bundle exec rspec
          spec/services/telegram_personal
          spec/controllers/api/v1/accounts/inboxes/telegram_personal_controller_spec.rb
          spec/controllers/webhooks/telegram_personal_controller_spec.rb
          spec/services/telegram
          spec/services/whatsmeow
          spec/models/inbox_spec.rb
          spec/models/attachment_spec.rb
          spec/finders/conversation_finder_spec.rb
      - run: >-
          bundle exec rubocop
          app/models/channel/telegram_personal.rb
          app/controllers/api/v1/accounts/inboxes/telegram_personal_controller.rb
          app/controllers/webhooks/telegram_personal_controller.rb
          app/services/telegram_personal
          spec/services/telegram_personal
          spec/controllers/api/v1/accounts/inboxes/telegram_personal_controller_spec.rb
          spec/controllers/webhooks/telegram_personal_controller_spec.rb
          spec/factories/channel/channel_telegram_personal.rb
          db/migrate/20261005120000_create_channel_telegram_personal.rb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-personal-schema
          path: db/schema.rb

  publish:
    if: github.event_name != 'pull_request'
    needs: [rails, frontend, service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chatwoot-whatsmeow:fork-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: telegram-personal-service
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chatwoot-whatsmeow:telegram-${{ github.sha }}
