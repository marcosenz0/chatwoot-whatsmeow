name: Publish Whatsmeow Calls Canary

on:
  push:
    branches:
      - codex/whatsmeow-voice-calls

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chatwoot-whatsmeow:calls-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
