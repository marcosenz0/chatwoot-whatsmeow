name: Publish Whatsmeow Calls Canary

on:
  push:
    branches:
      - codex/whatsmeow-voice-calls
      - codex/chatwoot-v4.18-common

permissions:
  contents: read
  packages: write

jobs:
  validate-call-history:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USERNAME: postgres
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake db:create db:schema:load
      - name: Validate preserved fork integrations
        run: >-
          bundle exec rspec
          spec/services/whatsmeow
          spec/listeners/whatsmeow_listener_spec.rb
          spec/models/conversation_pipeline_spec.rb
          spec/models/conversation_pipeline_stage_spec.rb
          spec/models/conversation_pipeline_assignment_spec.rb
          spec/services/pipelines
          spec/controllers/api/v1/accounts/conversations/whatsmeow_pix_messages_controller_spec.rb
          spec/models/whatsapp_automation_spec.rb
          spec/listeners/whatsapp_automation_listener_spec.rb
          spec/jobs/whatsapp/process_campaign_delivery_job_spec.rb
          spec/services/whatsapp/oneoff_campaign_service_spec.rb
          spec/services/whatsapp/incoming_message_whatsapp_cloud_service_spec.rb
          spec/services/whatsapp/template_processor_service_spec.rb
          spec/services/whatsapp/providers/whatsapp_cloud_service_spec.rb
          spec/services/whatsapp/health_service_spec.rb
          spec/models/inbox_spec.rb
          spec/enterprise/services/messages/audio_transcription_service_spec.rb
          spec/finders/conversation_finder_spec.rb
          spec/finders/message_finder_spec.rb

  publish:
    needs: validate-call-history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatwoot-whatsmeow:calls-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/chatwoot-whatsmeow:fork-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
