name: Publish Whatsmeow Calls Canary

on:
  push:
    branches:
      - codex/whatsmeow-voice-calls
      - codex/chatwoot-v4.18-common
      - codex/whatsmeow-stars-groups

permissions:
  contents: read
  packages: write

jobs:
  validate-whatsmeow-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate message anchors and media previews
        run: >-
          pnpm exec vitest run
          app/javascript/dashboard/store/modules/specs/conversations/actions.spec.js
          app/javascript/dashboard/helper/specs/whatsmeowAppLock.spec.js
          app/javascript/dashboard/helper/specs/whatsmeowCallVideo.spec.js
          app/javascript/dashboard/components-next/message

  validate-call-history:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USERNAME: postgres
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Validate migration from the previous fork schema
        run: |
          git fetch --no-tags --depth=1 origin 5bafe5cb77bba91902e6adcddd79d7aecca07b7d
          git show 5bafe5cb77bba91902e6adcddd79d7aecca07b7d:db/schema.rb > /tmp/fork-before-upgrade-schema.rb
          git ls-tree -r --name-only 5bafe5cb77bba91902e6adcddd79d7aecca07b7d -- db/migrate > /tmp/fork-before-upgrade-migrations.txt
          bundle exec rake db:create
          SCHEMA=/tmp/fork-before-upgrade-schema.rb bundle exec rake db:schema:load
          bundle exec rails runner - <<'RUBY'
          previous_versions = File.readlines('/tmp/fork-before-upgrade-migrations.txt').map { |path| File.basename(path).split('_').first }
          schema_migration = ActiveRecord::Base.connection_pool.schema_migration
          (schema_migration.versions - previous_versions).each { |version| schema_migration.delete_version(version) }
          RUBY
          bundle exec rake db:migrate
      - name: Validate preserved fork integrations
        run: >-
          bundle exec rspec
          spec/services/whatsmeow
          spec/listeners/whatsmeow_listener_spec.rb
          spec/models/conversation_pipeline_spec.rb
          spec/models/conversation_pipeline_stage_spec.rb
          spec/models/conversation_pipeline_assignment_spec.rb
          spec/services/pipelines
          spec/controllers/api/v1/accounts/conversations/whatsmeow_pix_messages_controller_spec.rb
          spec/models/whatsapp_automation_spec.rb
          spec/listeners/whatsapp_automation_listener_spec.rb
          spec/jobs/whatsapp/process_campaign_delivery_job_spec.rb
          spec/services/whatsapp/oneoff_campaign_service_spec.rb
          spec/services/whatsapp/incoming_message_whatsapp_cloud_service_spec.rb
          spec/services/whatsapp/template_processor_service_spec.rb
          spec/services/whatsapp/cloud_template_service_spec.rb
          spec/services/whatsapp/reauthorization_service_spec.rb
          spec/services/whatsapp/providers/whatsapp_cloud_service_spec.rb
          spec/services/whatsapp/health_service_spec.rb
          spec/models/inbox_spec.rb
          spec/enterprise/services/messages/audio_transcription_service_spec.rb
          spec/finders/conversation_finder_spec.rb
          spec/finders/message_finder_spec.rb
          spec/controllers/api/v1/accounts/whatsmeow_starred_messages_controller_spec.rb
          spec/controllers/api/v1/accounts/inboxes/whatsmeow_groups_controller_spec.rb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stars-groups-schema
          path: db/schema.rb
      - name: Inspect Ruby style for new endpoints
        run: >-
          bundle exec rubocop
          app/controllers/api/v1/accounts/whatsmeow_starred_messages_controller.rb
          app/controllers/api/v1/accounts/whatsmeow_conversations_controller.rb
          app/controllers/api/v1/accounts/inboxes/whatsmeow_groups_controller.rb
          app/services/whatsmeow/message_star_service.rb
          app/services/whatsmeow/group_change_service.rb
          app/models/whatsmeow_message_star.rb
          db/migrate/20261001090000_create_whatsmeow_message_stars.rb
          spec/services/whatsmeow/message_star_service_spec.rb
          spec/services/whatsmeow/group_change_service_spec.rb
          spec/controllers/api/v1/accounts/whatsmeow_starred_messages_controller_spec.rb
          spec/controllers/api/v1/accounts/inboxes/whatsmeow_groups_controller_spec.rb

  publish:
    needs: [validate-call-history, validate-whatsmeow-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatwoot-whatsmeow:calls-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/chatwoot-whatsmeow:fork-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
